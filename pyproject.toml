[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "droid-pipeline"
version = "0.1.0"
description = "DROID Multi-View 3D Tracking Pipeline"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "pybullet",
    "opencv-python",
    "scipy",
    "tqdm",
    "h5py",
    "mediapy",
    "yourdfpy",
    "plotly",
    "pyrender",
    "segment-anything @ git+https://github.com/facebookresearch/segment-anything.git",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "third_party*"]
